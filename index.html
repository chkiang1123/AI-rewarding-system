<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Leaderboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 500px; text-align: center; }
        h1 { margin: 0 0 10px 0; color: #333; font-size: 28px; }
        .subtitle { color: #777; margin-bottom: 30px; font-size: 14px; }
        .class-row { display: flex; justify-content: space-between; align-items: center; background: #fafafa; margin: 12px 0; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #ccc; transition: 0.3s; }
        .class-name { font-size: 20px; font-weight: bold; color: #444; display: flex; align-items: center; }
        .score { font-size: 22px; font-weight: bold; color: #222; }
        .winner { border-left-color: #FFD700; background: #FFFDF0; box-shadow: 0 2px 10px rgba(255, 215, 0, 0.15); }
        .winner .class-name::after { content: " 👑"; font-size: 18px; margin-left: 8px; }
        .winner .score { color: #d4af37; }
        .loading { font-size: 16px; color: #888; margin: 20px 0; }
        .refresh-btn { background-color: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .refresh-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>🏆 Class Leaderboard</h1>
    <div class="subtitle">Live Point Rankings (Instant Updates)</div>
    
    <div id="loadingStatus" class="loading">Connecting to Google Sheet...</div>
    
    <div id="leaderboardList" style="display: none;">
        <div class="class-row" id="row-1A"><span class="class-name">Class 1A</span><span class="score" id="score-1A">0 pts</span></div>
        <div class="class-row" id="row-1B"><span class="class-name">Class 1B</span><span class="score" id="score-1B">0 pts</span></div>
        <div class="class-row" id="row-1C"><span class="class-name">Class 1C</span><span class="score" id="score-1C">0 pts</span></div>
        <div class="class-row" id="row-1D"><span class="class-name">Class 1D</span><span class="score" id="score-1D">0 pts</span></div>
    </div>

    <button class="refresh-btn" onclick="fetchScores()">🔄 Refresh Standings</button>
</div>

<script>
    // Pulls data directly from your verified Google Sheet link layout
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1rPR3M3hTNVZ6NM6LmwphWacWIST7Zr_PQT7_y-EzPRs/gviz/tq?tqx=out:json&sheet=Records";

    function fetchScores() {
        const loader = document.getElementById('loadingStatus');
        const list = document.getElementById('leaderboardList');
        
        loader.style.display = "block";
        loader.innerText = "Loading live rankings...";

        fetch(SHEET_URL)
        .then(res => res.text())
        .then(txt => {
            const rawJson = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
            const rows = rawJson.table.rows;
            
            const scores = { "1A": 0, "1B": 0, "1C": 0, "1D": 0 };

            if (rows) {
                rows.forEach(row => {
                    // Column C is Index 2 in the Google Data Table format structure
                    if (row.c && row.c[2] && row.c[2].v) {
                        const className = row.c[2].v.toString().trim();
                        if (scores.hasOwnProperty(className)) {
                            scores[className]++;
                        }
                    }
                });
            }

            let maxScore = Math.max(scores["1A"], scores["1B"], scores["1C"], scores["1D"]);

            ["1A", "1B", "1C", "1D"].forEach(cls => {
                const scoreElement = document.getElementById(`score-${cls}`);
                const rowElement = document.getElementById(`row-${cls}`);
                const currentPoints = scores[cls];
                
                scoreElement.innerText = `${currentPoints} pts`;
                rowElement.classList.remove('winner');
                
                if (currentPoints === maxScore && maxScore > 0) {
                    rowElement.classList.add('winner');
                }
            });

            loader.style.display = "none";
            list.style.display = "block";
        })
        .catch(err => {
            loader.innerText = "❌ Configuration error reading spreadsheet layout.";
            console.error(err);
        });
    }

    window.onload = fetchScores;
</script>

</body>
</html>
